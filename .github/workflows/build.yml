# One Linux job, manual or tag triggered only, to save Actions minutes (docs/SPEC.md 14.2).
# Visual Studio stays the main build machine. Signed releases are made there, never here.
name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "21"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}

      - name: Design checks
        run: |
          python3 tools/design/contrast.py
          python3 tools/design/lint_layout.py src

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Core tests
        run: dotnet test tests/VisaryNotes.Core.Tests

      - name: Build APK
        run: dotnet build src/VisaryNotes.App -f net10.0-android -c Release

      - uses: actions/upload-artifact@v4
        with:
          name: VisaryNotes-apk
          path: src/VisaryNotes.App/bin/Release/net10.0-android/*-Signed.apk
          retention-days: 7
