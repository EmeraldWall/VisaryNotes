<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VisaryNotes home screen widgets v4</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
/* lint:off  token definitions, generated from tools/design/tokens.json */
.home{--sp-0:0px;--sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-6:24px;--sp-8:32px;--sp-12:48px;--h-control:48px;--h-primary:56px;--badge:40px;--icon:24px;--r-0:0px;--r-1:2px;--r-2:4px;--fs-caption:12px;--lh-caption:16px;--fs-label:13px;--lh-label:20px;--fs-ui:15px;--lh-ui:20px;--fs-title:16px;--lh-title:24px}
/* The outer widget radius is set by the launcher on Android 12 and newer (system_app_widget_background_radius). 20px is a stand in. */
.wg{border-radius:20px}
/* lint:on */
body{margin:0}
a{color:inherit}a:hover{color:inherit}
.home *{box-sizing:border-box}
.home button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.home button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.wg{position:relative;overflow:hidden;color:var(--ink);background:radial-gradient(140% 160% at 50% 50%,var(--frost) 55%,var(--frostRim) 100%);box-shadow:inset 0 1px 0 var(--edgeLo),inset 0 10px 14px -10px var(--edgeLo),inset 0 -1px 0 var(--edgeHi),inset 0 -8px 12px -10px var(--edgeHi)}
.pad{padding:var(--sp-4)}
.chamfer{clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,0 100%)}
.cap{font-size:var(--fs-caption);line-height:var(--lh-caption);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
.t1{font-size:var(--fs-title);line-height:var(--lh-title);font-weight:700}
.t2{font-size:var(--fs-label);line-height:var(--lh-label);font-weight:600;color:var(--soft)}
.qc{height:var(--h-primary);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--sp-0);font-size:var(--fs-label);line-height:var(--lh-label);font-weight:600;border-radius:var(--r-1);background:var(--fill)}
.qc.primary{background:linear-gradient(225deg,var(--bevel) 0 6px,rgba(255,255,255,0) 6px),var(--accent);color:var(--onAccent)}
.chk{width:var(--icon);height:var(--icon);border:2px solid var(--ink);border-radius:var(--r-1);display:grid;place-items:center;flex:none}
.chk.on{background:var(--ink);color:var(--solid)}
.chk svg{opacity:0}.chk.on svg{opacity:1}
.done{text-decoration:line-through;color:var(--soft)}
.item{display:flex;align-items:center;gap:var(--sp-3);min-height:var(--h-control);width:100%;text-align:left;font-size:var(--fs-title);font-weight:600;border-bottom:1px solid var(--line)}
.app-icon{display:flex;flex-direction:column;align-items:center;gap:var(--sp-1);font-size:var(--fs-caption);line-height:var(--lh-caption);font-weight:600;color:#ffffff}
.app-icon span:first-child{width:52px;height:52px;border-radius:var(--r-2);background:rgba(255,255,255,0.28)}
</style>
</helmet>
<div class="home" style="position: relative; width: 390px; height: 844px; overflow: hidden; font-family: 'Figtree', system-ui, sans-serif; {{vars}}">
<sc-if value="{{wpDark}}" hint-placeholder-val="{{true}}">
<svg aria-hidden="true" width="390" height="844" viewBox="0 0 390 844" style="position: absolute; inset: 0"><rect width="390" height="844" fill="#1E2C3A"></rect><circle cx="300" cy="170" r="60" fill="#E9C46A"></circle><path d="M0 420 L110 330 L200 390 L300 300 L390 360 L390 844 L0 844Z" fill="#2E4A5A"></path><path d="M0 560 L130 480 L250 540 L390 490 L390 844 L0 844Z" fill="#23413F"></path><path d="M0 700 L120 650 L260 700 L390 660 L390 844 L0 844Z" fill="#162B2A"></path></svg>
</sc-if>
<sc-if value="{{wpLight}}" hint-placeholder-val="{{false}}">
<svg aria-hidden="true" width="390" height="844" viewBox="0 0 390 844" style="position: absolute; inset: 0"><rect width="390" height="844" fill="#CFE8F5"></rect><circle cx="90" cy="150" r="56" fill="#FFF3C4"></circle><rect y="430" width="390" height="140" fill="#7CC6D9"></rect><rect y="570" width="390" height="274" fill="#F3E2B8"></rect><path d="M0 570 Q100 540 200 570 T390 560 L390 590 L0 590Z" fill="#FFFFFF" opacity="0.8"></path></svg>
</sc-if>
<sc-if value="{{wpBusy}}" hint-placeholder-val="{{false}}">
<svg aria-hidden="true" width="390" height="844" viewBox="0 0 390 844" style="position: absolute; inset: 0"><rect width="390" height="844" fill="#111111"></rect><rect x="0" y="0" width="65" height="844" fill="#F5F5F5"></rect><rect x="130" y="0" width="65" height="844" fill="#F5F5F5"></rect><rect x="260" y="0" width="65" height="844" fill="#F5F5F5"></rect><rect x="0" y="200" width="390" height="40" fill="#E63946"></rect><rect x="0" y="420" width="390" height="40" fill="#1D3557"></rect><rect x="0" y="640" width="390" height="40" fill="#F1C40F"></rect></svg>
</sc-if>

<div style="position: absolute; left: var(--sp-4); right: var(--sp-4); top: var(--sp-12); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--sp-4)">
<div class="app-icon"><span></span><span>Phone</span></div>
<div class="app-icon"><span></span><span>Messages</span></div>
<div class="app-icon"><span></span><span>Camera</span></div>
<div class="app-icon"><span></span><span>Files</span></div>
</div>

<div style="position: absolute; left: var(--sp-4); right: var(--sp-4); bottom: 120px; display: flex; flex-direction: column; gap: var(--sp-3)">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-3)">
<div class="wg pad" style="height: 152px; display: flex; flex-direction: column; gap: var(--sp-1)">
<span class="cap">Continue reading</span>
<span class="t1">Autumn Newsletter</span>
<span class="t2">Page 2 of 3</span>
<span style="height: 4px; background: var(--line); margin-top: auto; display: block"><span style="display: block; width: 58%; height: 100%; background: var(--accent)"></span></span>
</div>
<div class="wg pad" style="height: 152px; display: flex; flex-direction: column; gap: var(--sp-1)">
<span class="cap">Recent</span>
<span class="t1" style="font-weight: 600">Garden notes</span>
<span class="t1" style="font-weight: 600">Sprint 14 retro</span>
<span class="t1" style="font-weight: 600">Lease renewal</span>
</div>
</div>
<div class="wg pad" style="padding-bottom: var(--sp-2)">
<div style="display: flex; align-items: baseline; justify-content: space-between"><span class="t1">Groceries</span><span class="t2">{{doneText}}</span></div>
<sc-for list="{{items}}" as="it" hint-placeholder-count="4">
<button class="item" onClick="{{it.toggle}}" aria-pressed="{{it.done}}">
<span class="chk {{it.cls}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="square" aria-hidden="true"><path d="M5 12l4 4 10-10"></path></svg></span>
<span class="{{it.textCls}}">{{it.text}}</span>
</button>
</sc-for>
</div>
<div class="wg" style="padding: var(--sp-2); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--sp-2)">
<button class="qc"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><rect x="9" y="3" width="6" height="11"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>Voice</button>
<button class="qc"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><rect x="3" y="4" width="7" height="7"></rect><path d="M14 7h7M3 15h7v6H3zM14 18h7"></path></svg>List</button>
<button class="qc"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><rect x="9" y="10" width="6" height="6"></rect></svg>Photo</button>
<button class="qc primary chamfer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Note</button>
</div>
</div>

<div style="position: absolute; left: var(--sp-4); right: var(--sp-4); bottom: var(--sp-6); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--sp-4)">
<div class="app-icon"><span style="background: #0A6249"></span><span>VisaryNotes</span></div>
<div class="app-icon"><span></span><span>Browser</span></div>
<div class="app-icon"><span></span><span>Mail</span></div>
<div class="app-icon"><span></span><span>Settings</span></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"wallpaper":{"editor":"enum","options":["Dark landscape","Bright beach","Busy stripes"],"default":"Dark landscape"},"frost":{"editor":"enum","options":["Auto","Light frost","Dark frost"],"default":"Auto"},"$preview":{"width":390,"height":844}}'>
const ALPHA = {matched: 0.55, light: 0.8, dark: 0.85, rim: 0.2};
const FROST = {
  light: {glass:'#F7F7F4', solid:'#FBFAF7', ink:'#15181A', soft:'#474D52', accent:'#0A6249', onAccent:'#FFFFFF', line:'rgba(21,24,26,0.25)', fill:'rgba(21,24,26,0.07)', edgeHi:'rgba(255,255,255,0.95)', edgeLo:'rgba(0,0,0,0.25)', bevel:'rgba(255,255,255,0.45)'},
  dark: {glass:'#1C1E20', solid:'#1C1E20', ink:'#ECEDEE', soft:'#B9BEC3', accent:'#5ACBA4', onAccent:'#06261C', line:'rgba(236,237,238,0.25)', fill:'rgba(236,237,238,0.09)', edgeHi:'rgba(255,255,255,0.25)', edgeLo:'rgba(0,0,0,0.6)', bevel:'rgba(255,255,255,0.5)'}
};
const ITEMS = ['Oat milk','Lemons','Sourdough','Coffee beans'];
function rgba(hex, a) {
  const h = hex.replace('#', '');
  return 'rgba(' + parseInt(h.slice(0, 2), 16) + ',' + parseInt(h.slice(2, 4), 16) + ',' + parseInt(h.slice(4, 6), 16) + ',' + a + ')';
}
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {done: [true, false, true, false]};
  }
  renderVals() {
    const wp = this.props.wallpaper ?? 'Dark landscape';
    const frost = this.props.frost ?? 'Auto';
    const polarity = frost === 'Light frost' ? 'light' : frost === 'Dark frost' ? 'dark' : (wp === 'Bright beach' ? 'light' : 'dark');
    const f = FROST[polarity];
    // Matched: the frost has the same polarity as the wallpaper, which Auto picks from wallpaper colour hints.
    // A busy wallpaper has no reliable hint, so it gets the any wallpaper tint.
    const matched = (polarity === 'light' && wp === 'Bright beach') || (polarity === 'dark' && wp === 'Dark landscape');
    const a = matched ? ALPHA.matched : ALPHA[polarity];
    const vars = Object.keys(f).map((k) => '--' + k + ':' + f[k]).join(';') + ';--frost:' + rgba(f.glass, a) + ';--frostRim:' + rgba(f.glass, Math.min(1, a + ALPHA.rim));
    const d = this.state.done;
    return {
      vars,
      wpDark: wp === 'Dark landscape', wpLight: wp === 'Bright beach', wpBusy: wp === 'Busy stripes',
      doneText: d.filter(Boolean).length + ' of ' + d.length + ' done',
      items: ITEMS.map((text, i) => ({text, done: d[i], cls: d[i] ? 'on' : '', textCls: d[i] ? 'done' : '', toggle: () => { const n = d.slice(); n[i] = !n[i]; this.setState({done: n}); }}))
    };
  }
}
</script>
</body>
</html>
